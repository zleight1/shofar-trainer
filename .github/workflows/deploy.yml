name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create Cloudflare Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n[:space:]')
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          {
            echo "CLOUDFLARE_API_TOKEN=$TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT"
          } >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          name = "shofar-trainer"

          def call(method, url, payload=None):
              headers = {"Authorization": f"Bearer {token}"}
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as res:
                      return res.status, json.load(res)
              except urllib.error.HTTPError as err:
                  try:
                      body = json.load(err)
                  except Exception:
                      body = {"raw": err.read().decode("utf-8", "replace")}
                  return err.code, body

          status, body = call("GET", "https://api.cloudflare.com/client/v4/user/tokens/verify")
          print("verify", status, body.get("success"), (body.get("result") or {}).get("status"), body.get("errors"))
          get_url = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{name}"
          status, body = call("GET", get_url)
          print("get_project", status, body.get("success"), body.get("errors"))
          if status == 200:
              raise SystemExit(0)
          status, body = call(
              "POST",
              f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects",
              {"name": name, "production_branch": "main"},
          )
          print("create_project", status, body.get("success"), body.get("errors"))
          if not body.get("success"):
              raise SystemExit(1)
          PY
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          command: pages deploy dist --project-name=shofar-trainer
