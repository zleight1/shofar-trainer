name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check Cloudflare token can call Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n[:space:]')
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          echo "token_chars=${#TOKEN} account_chars=${#ACCOUNT}"
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req) as res:
                      return res.status, json.load(res)
              except urllib.error.HTTPError as err:
                  return err.code, json.load(err)
          status, body = get("https://api.cloudflare.com/client/v4/user/tokens/verify")
          print("verify", status, "success=", body.get("success"), "errors=", body.get("errors"), "token_status=", (body.get("result") or {}).get("status"))
          status, body = get(f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects")
          print("pages_list", status, "success=", body.get("success"), "errors=", body.get("errors"))
          PY
          {
            echo "CLOUDFLARE_API_TOKEN=$TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT"
          } >> "$GITHUB_ENV"
      - name: Ensure Cloudflare Pages project exists
        run: npx wrangler@4 pages project create shofar-trainer --production-branch main || true
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shofar-trainer
